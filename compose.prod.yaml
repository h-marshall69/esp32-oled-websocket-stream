# compose.prod.yaml

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      APP_ENV: production
      PORT: "8080"

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_WS_URL: "${VITE_WS_URL}"

    ports:
      - "${FRONTEND_PROD_PORT:-3000}:80"

    restart: unless-stopped

