root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/server"

entrypoint = ["./tmp/main"]

include_ext = [
  "go"
]

exclude_dir = [
  "tmp",
  ".git"
]

exclude_regex = [
  "_test\\.go$"
]

delay = 300

stop_on_error = true

send_interrupt = true

kill_delay = "500ms"

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"